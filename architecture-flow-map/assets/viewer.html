<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目运行地图</title>
<style>
:root {
  --paper: #f3f0e8; --panel: #fbfaf6; --ink: #1c2530; --muted: #5d6874; --line: #c9c3b5; --grid: #e4dfd3;
  --sync: #2b3a4a; --async: #23716b; --data: #8a5a0b; --hot: #c8391b; --hot-soft: #f6dcd3;
  --node: #fffdf8; --stub: #ece8de; --focus: #1f5fbf;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121820; --panel: #18202a; --ink: #dde4ec; --muted: #93a0ad; --line: #34404d; --grid: #1c2530;
    --sync: #b9c6d3; --async: #5cc2b8; --data: #e0a948; --hot: #ff6a42; --hot-soft: #3a2119;
    --node: #1b2430; --stub: #222c38; --focus: #7fb0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121820; --panel: #18202a; --ink: #dde4ec; --muted: #93a0ad; --line: #34404d; --grid: #1c2530;
  --sync: #b9c6d3; --async: #5cc2b8; --data: #e0a948; --hot: #ff6a42; --hot-soft: #3a2119;
  --node: #1b2430; --stub: #222c38; --focus: #7fb0ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.55 var(--sans); }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
h1 { font-size: 18px; margin: 0; letter-spacing: .01em; }
h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
h3 { font-size: 16px; margin: 0 0 6px; }
p { margin: 0 0 8px; }

.top { display: flex; align-items: baseline; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.top .meta { color: var(--muted); font-size: 12px; }
.crumbs { display: flex; gap: 6px; align-items: baseline; font-size: 13px; }
.crumbs button { border: 0; padding: 0; background: none; color: var(--focus); text-decoration: underline; }
.top .spacer { flex: 1; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; height: calc(100% - 49px); }
.side { overflow-y: auto; padding: 14px 16px 24px; background: var(--panel); }
.left { border-right: 1px solid var(--line); }
.right { border-left: 1px solid var(--line); }
section + section { margin-top: 18px; }

.scenario-list { display: grid; gap: 6px; }
.scenario-list button { text-align: left; padding: 8px 10px; }
.scenario-list button[aria-pressed="true"] { border-color: var(--hot); box-shadow: inset 3px 0 0 var(--hot); }
.scenario-list small { display: block; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; font-size: 13px; margin-bottom: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.stepper { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
.stepper .count { flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
.step-now { border-left: 3px solid var(--hot); padding: 2px 0 2px 10px; margin-bottom: 10px; }
.step-now h3 { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; white-space: nowrap; }
.chip.sync { color: var(--sync); } .chip.async { color: var(--async); border-color: var(--async); } .chip.data { color: var(--data); border-color: var(--data); }
.chip.op-create { background: var(--hot-soft); }
.steps { margin: 8px 0 0; padding-left: 22px; font-size: 13px; }
.steps li { cursor: pointer; padding: 2px 0; color: var(--muted); }
.steps li[aria-current="step"] { color: var(--ink); font-weight: 600; }
.branch { font-size: 13px; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
.branch b { color: var(--hot); font-weight: 600; }

.badge { display: inline-block; font-size: 11px; border-radius: 3px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; border: 1px solid; }
.badge.confirmed { color: var(--async); }
.badge.inferred { color: var(--data); border-style: dashed; }
.badge.unknown { color: var(--hot); border-style: dotted; }
.refs { list-style: none; padding: 0; margin: 6px 0; }
.refs li { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
.refs code { word-break: break-all; flex: 1; }
.refs button { font-size: 11px; padding: 0 6px; }
.note { font-size: 13px; color: var(--muted); }
.linklike { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; cursor: pointer; text-align: left; }
details { border-top: 1px solid var(--line); padding: 8px 0; }
details > summary { cursor: pointer; font-weight: 600; }
details ul { padding-left: 18px; margin: 6px 0 0; font-size: 13px; }
details li { margin-bottom: 4px; }
.states { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }

.stage { position: relative; overflow: hidden; min-height: 320px;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
#canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#canvas.dragging { cursor: grabbing; }
.tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.tools button { width: 34px; padding: 4px 0; }
.tools button.wide { width: auto; padding: 4px 10px; }
.legend { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; }
.legend .item { display: inline-flex; align-items: center; gap: 4px; }
.hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--hot); border-radius: 4px; padding: 4px 10px; font-size: 13px; }

.lane-band { fill: var(--panel); opacity: .55; }
.lane-label { fill: var(--muted); font-size: 12px; font-weight: 600; }
.node rect { fill: var(--node); stroke: var(--ink); stroke-width: 1.2; }
.node.stub rect { fill: var(--stub); stroke: var(--muted); stroke-dasharray: 3 3; }
.node.lvl-inferred rect { stroke-dasharray: 6 4; }
.node.lvl-unknown rect { stroke-dasharray: 2 3; }
.node text { fill: var(--ink); font-size: 13px; pointer-events: none; }
.node .sub { fill: var(--muted); font-size: 11px; }
.node .q { fill: var(--hot); font-weight: 700; }
.node { cursor: pointer; }
.node:hover rect { stroke-width: 2; }
.node.selected rect { stroke: var(--focus); stroke-width: 2.4; }
.node.hot rect { stroke: var(--hot); stroke-width: 2.6; fill: var(--hot-soft); }
.edge path.line { fill: none; stroke-width: 1.5; }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge.sync path.line { stroke: var(--sync); }
.edge.async path.line { stroke: var(--async); stroke-dasharray: 7 5; }
.edge.data path.line { stroke: var(--data); stroke-dasharray: 2 4; stroke-linecap: round; }
.edge .label rect { fill: var(--paper); stroke: var(--line); }
.edge .label text { font-size: 11px; fill: var(--ink); }
.edge.hot path.line { stroke: var(--hot); stroke-width: 2.8; }
.edge.hot .label rect { stroke: var(--hot); }
.edge.selected path.line { stroke: var(--focus); stroke-width: 2.6; }
.dim { opacity: .2; }
.dim.edge .label { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .edge.hot path.line { animation: flow 1s linear infinite; stroke-dasharray: 10 6; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
}

@media (max-width: 1100px) {
  .layout { grid-template-columns: 280px minmax(0, 1fr); }
  .right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
}
@media (max-width: 720px) {
  .layout { display: block; height: auto; }
  .stage { height: 62vh; }
  .side { border: 0; border-top: 1px solid var(--line); }
  .legend { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1 id="title"></h1>
  <span class="meta" id="meta"></span>
  <nav class="crumbs" id="crumbs" aria-label="视图层级"></nav>
  <span class="spacer"></span>
  <button id="theme" type="button"></button>
</header>
<main class="layout">
  <aside class="side left" id="left"></aside>
  <section class="stage" id="stage">
    <svg id="canvas" role="img" aria-label="architecture map">
      <defs>
        <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--sync)"/></marker>
        <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--async)"/></marker>
        <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--data)"/></marker>
        <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker>
        <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--focus)"/></marker>
      </defs>
      <g id="vp"></g>
    </svg>
    <div class="tools">
      <button type="button" id="zin" aria-label="放大">+</button>
      <button type="button" id="zout" aria-label="缩小">−</button>
      <button type="button" id="zfit" class="wide"></button>
    </div>
    <div class="hint" id="hint" hidden></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="side right" id="right"></aside>
</main>
<script id="flow-map-data" type="application/json">__FLOW_MAP_DATA__</script>
<script>
(() => {
"use strict";
const STR = {
  zh: {
    overview: "全局", fit: "重置视图", theme: "切换深浅色", scenarios: "关键场景", noScenario: "只看结构，不演示场景",
    trigger: "触发", result: "结果", why: "为什么重要", prev: "← 上一步", next: "下一步 →", step: (i, n) => `第 ${i} / ${n} 步`,
    allSteps: "全部步骤", branches: "失败处理与分支", data: "数据", evidence: "依据", children: "内部组件", expand: "展开模块内部",
    objects: "相关业务对象", parent: "所属模块", incoming: "进入的连线", outgoing: "发出的连线", kind: "类型", lane: "所在层", role: "职责",
    summary: "项目如何运转", bizObjects: "业务对象", open: "尚未确认与推断", drift: "文档与实现的差异",
    states: "状态", createdBy: "创建", readBy: "读取", writtenBy: "修改", storedIn: "存放于", relations: "关联",
    claim: "文档说", actual: "实际实现", needs: "需要的证据", basis: "推断依据", copy: "复制", copied: "已复制",
    stepTouches: (m) => `本步骤涉及「${m}」内部组件，可展开查看`, expandShort: "展开",
    stub: "外部模块", none: "无", generated: "生成于", commit: "对应提交", template: "这是查看器模板，没有地图数据。请用 build_map.py 生成。",
    levels: { confirmed: "已确认", inferred: "推断", unknown: "待确认" },
    edgeKinds: { sync: "同步调用", async: "异步：事件 / 队列 / 回调", data: "数据读写" },
    ops: { create: "创建", read: "读取", update: "修改", delete: "删除" },
    nodeKinds: { actor: "使用者", entry: "入口", module: "模块", store: "数据存储", external: "外部服务", job: "后台任务", config: "配置", doc: "文档" },
    legendHot: "当前步骤", legendLevels: "实框 已确认 · 虚框 推断 · 点框 待确认", more: (n) => `等 ${n} 条`
  },
  en: {
    overview: "Overview", fit: "Reset view", theme: "Toggle theme", scenarios: "Key scenarios", noScenario: "Structure only, no scenario",
    trigger: "Trigger", result: "Result", why: "Why it matters", prev: "← Prev", next: "Next →", step: (i, n) => `Step ${i} / ${n}`,
    allSteps: "All steps", branches: "Failure handling and branches", data: "Data", evidence: "Evidence", children: "Inside this module", expand: "Expand module",
    objects: "Business objects", parent: "Module", incoming: "Incoming", outgoing: "Outgoing", kind: "Kind", lane: "Layer", role: "Responsibility",
    summary: "How the project runs", bizObjects: "Business objects", open: "Unconfirmed and inferred", drift: "Docs vs. implementation",
    states: "States", createdBy: "Created by", readBy: "Read by", writtenBy: "Written by", storedIn: "Stored in", relations: "Relations",
    claim: "Docs say", actual: "Code does", needs: "Evidence needed", basis: "Basis", copy: "Copy", copied: "Copied",
    stepTouches: (m) => `This step happens inside "${m}"`, expandShort: "Expand",
    stub: "Outside module", none: "None", generated: "Generated", commit: "Commit", template: "This is the viewer template with no map data. Build it with build_map.py.",
    levels: { confirmed: "Confirmed", inferred: "Inferred", unknown: "Unconfirmed" },
    edgeKinds: { sync: "Synchronous call", async: "Async: event / queue / callback", data: "Data read / write" },
    ops: { create: "create", read: "read", update: "update", delete: "delete" },
    nodeKinds: { actor: "Actor", entry: "Entry point", module: "Module", store: "Data store", external: "External service", job: "Background job", config: "Config", doc: "Doc" },
    legendHot: "Current step", legendLevels: "solid confirmed · dashed inferred · dotted unconfirmed", more: (n) => `+${n - 1} more`
  }
};

const $ = (id) => document.getElementById(id);
const svg = $("canvas");
const SVGNS = "http://www.w3.org/2000/svg";
let D;
try { D = JSON.parse($("flow-map-data").textContent); } catch (_) { D = null; }
if (!D || !Array.isArray(D.nodes)) { document.body.textContent = STR.zh.template; return; }
const T = String(D.locale || "zh").toLowerCase().startsWith("en") ? STR.en : STR.zh;
document.documentElement.lang = T === STR.en ? "en" : "zh-CN";

// ---- index ----
const byId = new Map(), parentOf = new Map();
for (const n of D.nodes) { byId.set(n.id, n); for (const c of n.children || []) { byId.set(c.id, c); parentOf.set(c.id, n.id); } }
const topOf = (id) => parentOf.get(id) || id;
const edgeById = new Map(D.edges.map((e) => [e.id, e]));
const objById = new Map((D.objects || []).map((o) => [o.id, o]));
const scById = new Map(D.scenarios.map((s) => [s.id, s]));
const laneLabel = new Map(D.lanes.map((l) => [l.id, l.label]));
const RANK = { confirmed: 0, inferred: 1, unknown: 2 };
const lvl = (x) => (x && x.evidence && x.evidence.level) || "unknown";

const S = { view: null, scenario: null, step: 0, sel: null, orient: null };
const NW = 188, NH = 62, GX = 120, GY = 30, HEAD = 34;

// ---- tiny DOM helpers ----
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const k of kids) if (k != null) el.append(k);
  return el;
}
const badge = (level) => h("span", { class: `badge ${level}` }, T.levels[level] || level);
function nameOf(id) { const n = byId.get(id) || objById.get(id) || edgeById.get(id); return n ? (n.label || id) : id; }

function copyText(text, btn) {
  const done = () => { btn.textContent = T.copied; setTimeout(() => (btn.textContent = T.copy), 1200); };
  try { navigator.clipboard.writeText(text).then(done, () => fallback()); } catch (_) { fallback(); }
  function fallback() {
    const ta = h("textarea", {}, text); document.body.append(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (_) { /* leave the text selectable */ } ta.remove();
  }
}
function refList(refs) {
  if (!refs || !refs.length) return null;
  return h("ul", { class: "refs" }, refs.map((r) => {
    const loc = r.path + (r.line ? `:${r.line}` : "");
    const btn = h("button", { type: "button", onclick: () => copyText(loc, btn) }, T.copy);
    return h("li", {}, h("code", {}, loc + (r.symbol ? `  · ${r.symbol}` : "")), btn);
  }));
}
function evidenceBlock(ev) {
  if (!ev) return null;
  return h("div", {},
    h("h2", {}, T.evidence, badge(ev.level)),
    ev.note ? h("p", { class: "note" }, `${T.basis}：${ev.note}`) : null,
    ev.needs ? h("p", { class: "note" }, `${T.needs}：${ev.needs}`) : null,
    refList(ev.refs));
}
const link = (id, label) => h("button", { type: "button", class: "linklike", onclick: () => select(objById.has(id) ? "object" : "node", id) }, label || nameOf(id));

// ---- layout ----
function wrap(text, max) {
  const out = []; let line = "", w = 0;
  for (const ch of String(text)) {
    const cw = /[\u0000-\u00ff]/.test(ch) ? 0.55 : 1;
    if (w + cw > max && line) { out.push(line); line = ""; w = 0; }
    line += ch; w += cw;
  }
  if (line) out.push(line);
  if (out.length > 2) { out.length = 2; out[1] = out[1].slice(0, -1) + "…"; }
  return out;
}
function aggregate(edges, mapEnd) {
  const groups = new Map();
  for (const e of edges) {
    const a = mapEnd(e.from), b = mapEnd(e.to);
    if (!a || !b || a === b) continue;
    const key = `${a}>${b}|${e.kind}`;
    if (!groups.has(key)) groups.set(key, { key, from: a, to: b, kind: e.kind, ids: [] });
    groups.get(key).ids.push(e.id);
  }
  return [...groups.values()].map((g) => {
    const es = g.ids.map((id) => edgeById.get(id));
    g.level = es.reduce((m, e) => (RANK[lvl(e)] > RANK[m] ? lvl(e) : m), "confirmed");
    g.label = es.length === 1 ? es[0].label : `${es[0].label} ${T.more(es.length)}`;
    return g;
  });
}
// A layout is a list of tracks (lanes, or stub/children groups in a module view). Tracks become
// columns ("h") or rows ("v"), whichever lets the current canvas show the map larger.
function tracksOverview() {
  const tracks = D.lanes.filter((l) => D.nodes.some((n) => n.lane === l.id))
    .map((l) => ({ label: l.label, ids: D.nodes.filter((n) => n.lane === l.id).map((n) => n.id) }));
  return { tracks, edges: aggregate(D.edges, topOf) };
}
function tracksModule(mid) {
  const mod = byId.get(mid), kids = (mod.children || []).map((k) => k.id);
  const inside = (id) => parentOf.get(id) === mid;
  const mapEnd = (id) => (inside(id) ? id : id === mid ? null : topOf(id));
  const relevant = D.edges.filter((e) => inside(e.from) || inside(e.to));
  const before = [], after = [];
  for (const e of relevant) { const f = mapEnd(e.from); if (!inside(e.from) && f && !before.includes(f)) before.push(f); }
  for (const e of relevant) { const t = mapEnd(e.to); if (!inside(e.to) && t && !before.includes(t) && !after.includes(t)) after.push(t); }
  const chunks = kids.length > 6 ? [kids.slice(0, Math.ceil(kids.length / 2)), kids.slice(Math.ceil(kids.length / 2))] : [kids];
  const tracks = [];
  if (before.length) tracks.push({ label: T.stub, ids: before, stub: true });
  chunks.forEach((ids, i) => tracks.push({ label: i ? "" : mod.label, ids }));
  if (after.length) tracks.push({ label: T.stub, ids: after, stub: true });
  return { tracks, edges: aggregate(relevant, mapEnd) };
}
const RW = NW + 40, RP = NH + 96;  // vertical orientation: node pitch within a row, row pitch
function extent(tracks, orient) {
  const most = Math.max(1, ...tracks.map((t) => t.ids.length));
  return orient === "h" ? { w: tracks.length * (NW + GX) - GX, h: HEAD + most * (NH + GY) } : { w: most * RW, h: tracks.length * RP };
}
function chooseOrient(tracks) {
  const r = svg.getBoundingClientRect(), cw = r.width || 800, ch = (r.height || 600) - 40;
  const k = (o) => { const e = extent(tracks, o); return Math.min(cw / e.w, ch / e.h); };
  return k("v") > k("h") ? "v" : "h";
}
function place(tracks, orient) {
  const boxes = new Map(), bands = [];
  const most = Math.max(1, ...tracks.map((t) => t.ids.length));
  tracks.forEach((t, i) => {
    let at;

  else if (ev.key === "0") fit();
});
$("theme").textContent = T.theme;
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
window.addEventListener("resize", () => { S.orient = null; drawCanvas(); fit(); });

const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get("m") && (byId.get(hp.get("m"))?.children || []).length) S.view = hp.get("m");
if (scById.has(hp.get("s"))) { S.scenario = hp.get("s"); S.step = Math.min(scById.get(S.scenario).steps.length - 1, Math.max(0, (+hp.get("i") || 1) - 1)); }
drawLegend();
render(true);
})();
</script>
</body>
